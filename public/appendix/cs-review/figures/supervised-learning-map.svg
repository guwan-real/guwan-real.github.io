<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">人工智能包含关系与学习流程</title>
  <desc id="desc">深度学习属于机器学习，机器学习属于人工智能。开发时依次进行数据划分、训练、验证选择和独立测试；使用时把新输入送入已训练模型产生预测。</desc>
  <rect width="960" height="700" fill="#f8fafc"/>
  <text x="40" y="50" font-family="sans-serif" font-size="29" font-weight="700" fill="#102b43">先分清概念，再分清训练与使用</text>
  <rect x="40" y="80" width="880" height="230" rx="16" fill="#e1edf8" stroke="#537ea2" stroke-width="2"/>
  <text x="64" y="120" font-family="sans-serif" font-size="25" font-weight="700" fill="#153b5d">人工智能 AI</text>
  <text x="64" y="162" font-family="sans-serif" font-size="20" fill="#244b6d">也包括规则推理、</text>
  <text x="64" y="193" font-family="sans-serif" font-size="20" fill="#244b6d">搜索与规划等方法</text>
  <rect x="300" y="125" width="590" height="155" rx="14" fill="#c7e9e6" stroke="#367b76" stroke-width="2"/>
  <text x="322" y="163" font-family="sans-serif" font-size="24" font-weight="700" fill="#164d48">机器学习 ML：从数据与反馈中学习</text>
  <rect x="540" y="185" width="325" height="70" rx="12" fill="#fff2cd" stroke="#a98125" stroke-width="2"/>
  <text x="562" y="228" font-family="sans-serif" font-size="23" font-weight="700" fill="#664b10">深度学习 DL：多层网络</text>
  <text x="40" y="359" font-family="sans-serif" font-size="24" font-weight="700" fill="#102b43">开发阶段：数据划分后，各部分有不同职责</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="40" y="385" width="195" height="98" rx="12" fill="#ffffff" stroke="#62819c" stroke-width="2"/>
    <text x="137" y="420" font-size="23" font-weight="700" fill="#153b5d">划分数据</text><text x="137" y="454" font-size="19" fill="#244b6d">按时间、设备等约束</text>
    <rect x="270" y="385" width="195" height="98" rx="12" fill="#ffffff" stroke="#62819c" stroke-width="2"/>
    <text x="367" y="420" font-size="23" font-weight="700" fill="#153b5d">训练</text><text x="367" y="454" font-size="19" fill="#244b6d">学习模型参数</text>
    <rect x="500" y="385" width="195" height="98" rx="12" fill="#ffffff" stroke="#62819c" stroke-width="2"/>
    <text x="597" y="420" font-size="23" font-weight="700" fill="#153b5d">验证</text><text x="597" y="454" font-size="19" fill="#244b6d">选模型、阈值、轮数</text>
    <rect x="730" y="385" width="190" height="98" rx="12" fill="#ffffff" stroke="#62819c" stroke-width="2"/>
    <text x="825" y="420" font-size="23" font-weight="700" fill="#153b5d">独立测试</text><text x="825" y="454" font-size="19" fill="#244b6d">检验未见数据表现</text>
  </g>
  <g fill="#416784"><path d="M241 426h15v-7l12 15-12 15v-7h-15z"/><path d="M471 426h15v-7l12 15-12 15v-7h-15z"/><path d="M701 426h15v-7l12 15-12 15v-7h-15z"/></g>
  <text x="40" y="542" font-family="sans-serif" font-size="24" font-weight="700" fill="#102b43">使用阶段：通常固定参数，计算新样本的预测</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#164d48">
    <rect x="105" y="566" width="190" height="73" rx="12" fill="#e2f4ee" stroke="#448975" stroke-width="2"/><text x="200" y="611" font-size="24">新输入</text>
    <rect x="385" y="566" width="190" height="73" rx="12" fill="#e2f4ee" stroke="#448975" stroke-width="2"/><text x="480" y="611" font-size="24">已训练模型</text>
    <rect x="665" y="566" width="190" height="73" rx="12" fill="#e2f4ee" stroke="#448975" stroke-width="2"/><text x="760" y="611" font-size="24">预测与业务核验</text>
  </g>
  <g fill="#367b76"><path d="M310 594h50v-8l17 17-17 17v-8h-50z"/><path d="M590 594h50v-8l17 17-17 17v-8h-50z"/></g>
  <text x="40" y="677" font-family="sans-serif" font-size="19" fill="#445b6e">数据质量、评估划分、实际成本与安全约束，贯穿整个流程。</text>
</svg>
