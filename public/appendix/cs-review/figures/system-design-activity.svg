<svg xmlns="http://www.w3.org/2000/svg" width="760" height="810" viewBox="0 0 760 810" role="img" aria-labelledby="title desc"><title id="title">报修受理活动图</title><desc id="desc">先判断信息完整与否，不完整则补全重试。创建工单后并行记录审计和发送通知，再汇合显示编号并结束。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="810" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">活动图：判断分路，并行要同步</text><circle cx="375" cy="82" r="11" fill="#245a47"/><path d="M375 93L375 106" class="line" marker-end="url(#open)"/><path d="M375 106L388 115L375 124L362 115Z" class="green"/><path d="M375 124L375 140" class="line" marker-end="url(#open)"/><rect x="264" y="140" width="222" height="53" rx="12" class="green"/><text x="375.0" y="173.5" class="" text-anchor="middle">提交并校验信息</text><path d="M375 193L375 205" class="line" marker-end="url(#open)"/><path d="M375 205L435 245L375 285L315 245Z" class="green"/><text x="375" y="252" class="" text-anchor="middle">完整？</text><path d="M435 245L583 245" class="line" marker-end="url(#open)"/><text x="487" y="231" class="label" text-anchor="start">[否]</text><rect x="583" y="217" width="143" height="56" rx="12" class="box"/><text x="654.5" y="252.0" class="" text-anchor="middle">补全信息</text><path d="M655 217V115H388" class="line" marker-end="url(#open)"/><path d="M375 285L375 327" class="line" marker-end="url(#open)"/><text x="394" y="309" class="label" text-anchor="start">[是]</text><rect x="282" y="327" width="186" height="53" rx="12" class="green"/><text x="375.0" y="360.5" class="" text-anchor="middle">创建工单</text><path d="M375 380L375 412" class="line" marker-end="url(#open)"/><rect x="150" y="412" width="450" height="7" fill="#245a47"/><text x="622" y="423" class="label" text-anchor="start">fork</text><path d="M205 419L205 463" class="line" marker-end="url(#open)"/><path d="M545 419L545 463" class="line" marker-end="url(#open)"/><rect x="100" y="463" width="210" height="55" rx="12" class="box"/><text x="205.0" y="497.5" class="" text-anchor="middle">记录审计</text><rect x="440" y="463" width="210" height="55" rx="12" class="box"/><text x="545.0" y="497.5" class="" text-anchor="middle">发送通知</text><path d="M205 518L205 568" class="line" marker-end="url(#open)"/><path d="M545 518L545 568" class="line" marker-end="url(#open)"/><rect x="150" y="568" width="450" height="7" fill="#245a47"/><text x="622" y="581" class="label" text-anchor="start">join</text><path d="M375 575L375 614" class="line" marker-end="url(#open)"/><rect x="282" y="614" width="186" height="53" rx="12" class="green"/><text x="375.0" y="647.5" class="" text-anchor="middle">显示工单编号</text><path d="M375 667L375 703" class="line" marker-end="url(#open)"/><circle cx="375" cy="718" r="15" class="line"/><circle cx="375" cy="718" r="9" fill="#245a47"/><text x="28" y="773" class="label" text-anchor="start">菱形选择一条路；fork 启动两条路；join 在本例等待两条路完成。</text></svg>
