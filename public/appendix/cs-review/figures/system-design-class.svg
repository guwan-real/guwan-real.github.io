<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">工单类图与多重性</title><desc id="desc">工单类的类名、属性、操作三栏；每张工单恰好对应一台设备，设备可以没有或有多张工单。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="580" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">类图：先读三栏，再读关联两端的数量</text><rect x="28" y="80" width="435" height="265" rx="0" class="box"/><path d="M28 133L463 133" class="line"/><path d="M28 223L463 223" class="line"/><text x="245" y="114" class="" text-anchor="middle">工单 Ticket</text><text x="46" y="172" class="" text-anchor="start">- id: string</text><text x="46" y="207" class="" text-anchor="start">- status: Status</text><text x="46" y="267" class="" text-anchor="start">+ assign(worker: Worker): void</text><text x="46" y="308" class="" text-anchor="start">+ close(): void</text><text x="495" y="112" class="label" text-anchor="start">① 类名</text><text x="495" y="182" class="label" text-anchor="start">② 属性：保存什么</text><text x="495" y="274" class="label" text-anchor="start">③ 操作：能做什么</text><rect x="28" y="414" width="200" height="72" rx="0" class="box"/><text x="128.0" y="457.0" class="" text-anchor="middle">工单 Ticket</text><rect x="534" y="414" width="198" height="72" rx="0" class="box"/><text x="633.0" y="457.0" class="" text-anchor="middle">设备 Device</text><path d="M228 450L534 450" class="line"/><text x="254" y="432" class="label" text-anchor="start">0..*</text><text x="500" y="432" class="label" text-anchor="start">1</text><text x="375" y="488" class="" text-anchor="middle">对应</text><text x="28" y="542" class="label" text-anchor="start">固定一张工单 → 恰好一台设备；固定一台设备 → 零到多张工单。</text></svg>
