<svg xmlns="http://www.w3.org/2000/svg" width="760" height="583" viewBox="0 0 760 583" role="img" aria-labelledby="title desc"><title id="title">组件与部署对比</title><desc id="desc">组件图表示页面依赖工单业务、工单业务依赖存储。部署图表示用户设备、应用执行环境、数据库执行环境及其制品与通信连接。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="583" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">组件图看软件依赖，部署图看运行位置</text><text x="28" y="82" class="label" text-anchor="start">① 软件组件（虚线箭头指向被依赖的组件）</text><rect x="28" y="108" width="188" height="84" rx="0" class="box"/><text x="122" y="136" class="label" text-anchor="middle">«component»</text><text x="122" y="171" class="" text-anchor="middle">页面</text><rect x="286" y="108" width="188" height="84" rx="0" class="box"/><text x="380" y="136" class="label" text-anchor="middle">«component»</text><text x="380" y="171" class="" text-anchor="middle">工单业务</text><rect x="544" y="108" width="188" height="84" rx="0" class="box"/><text x="638" y="136" class="label" text-anchor="middle">«component»</text><text x="638" y="171" class="" text-anchor="middle">存储</text><path d="M216 150L286 150" class="line dash" marker-end="url(#open)"/><path d="M474 150L544 150" class="line dash" marker-end="url(#open)"/><path d="M28 239L732 239" class="line"/><text x="28" y="286" class="label" text-anchor="start">② 部署节点（框内显示部署的软件制品）</text><path d="M28 354L45 337H221V469L204 486H28Z" class="box"/><path d="M28 354H204L221 337M204 354V486" class="line"/><text x="116" y="384" class="small" text-anchor="middle">«device» 用户设备</text><rect x="42" y="403" width="149" height="62" rx="0" class="box"/><text x="116" y="427" class="small" text-anchor="middle">«artifact»</text><text x="116" y="453" class="label" text-anchor="middle">浏览器</text><path d="M286 354L303 337H479V469L462 486H286Z" class="box"/><path d="M286 354H462L479 337M462 354V486" class="line"/><text x="374" y="384" class="small" style="font-size:14px" text-anchor="middle">«executionEnvironment»</text><rect x="300" y="403" width="149" height="62" rx="0" class="box"/><text x="374" y="427" class="small" text-anchor="middle">«artifact»</text><text x="374" y="453" class="label" text-anchor="middle">报修应用</text><path d="M544 354L561 337H737V469L720 486H544Z" class="box"/><path d="M544 354H720L737 337M720 354V486" class="line"/><text x="632" y="384" class="small" style="font-size:14px" text-anchor="middle">«executionEnvironment»</text><rect x="558" y="403" width="149" height="62" rx="0" class="box"/><text x="632" y="427" class="small" text-anchor="middle">«artifact»</text><text x="632" y="453" class="label" text-anchor="middle">数据库程序</text><path d="M221 420L286 420" class="line"/><path d="M479 420L544 420" class="line"/><text x="250" y="410" class="small" text-anchor="middle">HTTPS</text><text x="509" y="410" class="small" text-anchor="middle">连接</text><text x="28" y="547" class="label" text-anchor="start">教学示意：逻辑组件不必一一对应物理机器；本学习网站仍为静态站点。</text></svg>
