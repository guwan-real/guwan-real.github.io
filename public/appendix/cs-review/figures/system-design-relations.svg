<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="title desc"><title id="title">六种 UML 类关系</title><desc id="desc">关联用实线；依赖用虚线开放箭头；泛化用实线空心三角；实现用虚线空心三角；聚合空心菱形和组合实心菱形均位于整体一端。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="750" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">类关系：线型、端点形状、符号所在端</text><text x="28" y="114" class="label" text-anchor="start">关联</text><rect x="143" y="83" width="215" height="56" rx="0" class="box"/><text x="250.5" y="118.0" class="" text-anchor="middle">工单</text><rect x="503" y="83" width="229" height="56" rx="0" class="box"/><text x="617.5" y="118.0" class="" text-anchor="middle">设备</text><path d="M358 111L503 111" class="line"/><text x="28" y="215" class="label" text-anchor="start">依赖</text><rect x="143" y="184" width="215" height="56" rx="0" class="box"/><text x="250.5" y="219.0" class="" text-anchor="middle">报修服务</text><rect x="503" y="184" width="229" height="56" rx="0" class="box"/><text x="617.5" y="219.0" class="" text-anchor="middle">通知接口</text><path d="M358 212L503 212" class="line dash" marker-end="url(#open)"/><text x="28" y="316" class="label" text-anchor="start">泛化</text><rect x="143" y="285" width="215" height="56" rx="0" class="box"/><text x="250.5" y="320.0" class="" text-anchor="middle">紧急工单</text><rect x="503" y="285" width="229" height="56" rx="0" class="box"/><text x="617.5" y="320.0" class="" text-anchor="middle">工单</text><path d="M358 313L503 313" class="line" marker-end="url(#triangle)"/><text x="28" y="417" class="label" text-anchor="start">实现</text><rect x="143" y="386" width="215" height="56" rx="0" class="box"/><text x="250.5" y="421.0" class="" text-anchor="middle">短信通知器</text><rect x="503" y="386" width="229" height="56" rx="0" class="box"/><text x="617.5" y="421.0" class="" text-anchor="middle">«interface» 通知</text><path d="M358 414L503 414" class="line dash" marker-end="url(#triangle)"/><text x="28" y="518" class="label" text-anchor="start">共享聚合</text><rect x="143" y="487" width="215" height="56" rx="0" class="box"/><text x="250.5" y="522.0" class="" text-anchor="middle">班组（整体）</text><rect x="503" y="487" width="229" height="56" rx="0" class="box"/><text x="617.5" y="522.0" class="" text-anchor="middle">员工（部分）</text><path d="M358 515H503" class="line" marker-start="url(#diamond)"/><text x="28" y="619" class="label" text-anchor="start">组合</text><rect x="143" y="588" width="215" height="56" rx="0" class="box"/><text x="250.5" y="623.0" class="" text-anchor="middle">工单（整体）</text><rect x="503" y="588" width="229" height="56" rx="0" class="box"/><text x="617.5" y="623.0" class="" text-anchor="middle">明细项（部分）</text><path d="M358 616H503" class="line" marker-start="url(#solidDiamond)"/><text x="28" y="716" class="label" text-anchor="start">三角形指向父类 / 接口；空心或实心菱形贴着整体。</text></svg>
