<svg xmlns="http://www.w3.org/2000/svg" width="760" height="716" viewBox="0 0 760 716" role="img" aria-labelledby="title desc"><title id="title">报修提交时序图</title><desc id="desc">三条生命线按自上而下的消息展示提交和创建工单。alt上分支设备有效则返回编号，下分支else返回错误，两个分支不是顺次执行。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="716" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">时序图：从上到下读消息，分支只择其一</text><rect x="22" y="75" width="176" height="52" rx="0" class="box"/><text x="110.0" y="108.0" class="" text-anchor="middle">报修人</text><path d="M110 127L110 602" class="line dash"/><rect x="277" y="75" width="176" height="52" rx="0" class="box"/><text x="365.0" y="108.0" class="" text-anchor="middle">报修页面</text><path d="M365 127L365 602" class="line dash"/><rect x="547" y="75" width="176" height="52" rx="0" class="box"/><text x="635.0" y="108.0" class="" text-anchor="middle">工单服务</text><path d="M635 127L635 602" class="line dash"/><rect x="357" y="167" width="16" height="394" rx="0" class="green"/><rect x="627" y="216" width="16" height="298" rx="0" class="green"/><path d="M110 171L357 171" class="line" marker-end="url(#filled)"/><text x="144" y="157" class="label" text-anchor="start">1. 提交报修</text><path d="M373 216L627 216" class="line" marker-end="url(#filled)"/><text x="387" y="201" class="small" text-anchor="start">2. create(id, description)</text><rect x="40" y="254" width="673" height="286" rx="0" class="box" style="fill:none"/><rect x="40" y="254" width="65" height="36" rx="0" class="box"/><text x="72.5" y="279.0" class="" text-anchor="middle">alt</text><text x="127" y="280" class="label" text-anchor="start">[设备有效]</text><path d="M627 325L373 325" class="line dash" marker-end="url(#open)"/><text x="412" y="310" class="label" text-anchor="start">3. 返回工单编号</text><path d="M357 370L110 370" class="line dash" marker-end="url(#open)"/><text x="148" y="355" class="label" text-anchor="start">4. 显示受理结果</text><path d="M40 400L713 400" class="line dash"/><text x="127" y="428" class="label" text-anchor="start">[else]</text><path d="M627 468L373 468" class="line dash" marker-end="url(#open)"/><text x="425" y="454" class="label" text-anchor="start">返回校验错误</text><path d="M357 513L110 513" class="line dash" marker-end="url(#open)"/><text x="157" y="499" class="label" text-anchor="start">提示修改</text><text x="28" y="648" class="label" text-anchor="start">竖虚线：生命线   细长矩形：执行条   横箭头：消息   alt：备选行为</text><text x="28" y="681" class="label" text-anchor="start">实心箭头为同步调用；虚线开放箭头为返回。图上距离不是耗时刻度。</text></svg>
