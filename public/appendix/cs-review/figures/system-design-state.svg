<svg xmlns="http://www.w3.org/2000/svg" width="760" height="695" viewBox="0 0 760 695" role="img" aria-labelledby="title desc"><title id="title">工单状态机图</title><desc id="desc">草稿在submit事件且信息完整时生成编号进入已提交。已提交可派工或取消；已派工可完工到已关闭，之后结束。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="695" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">状态图：同一张工单怎样改变状态</text><circle cx="103" cy="90" r="11" fill="#245a47"/><path d="M103 101L103 141" class="line" marker-end="url(#open)"/><rect x="33" y="141" width="140" height="60" rx="12" class="green"/><text x="103.0" y="178.0" class="" text-anchor="middle">草稿</text><path d="M173 171L421 171" class="line" marker-end="url(#open)"/><text x="195" y="133" class="label" text-anchor="start">submit [信息完整]</text><text x="214" y="202" class="label" text-anchor="start">/ 生成工单编号</text><rect x="421" y="141" width="175" height="60" rx="12" class="green"/><text x="508.5" y="178.0" class="" text-anchor="middle">已提交</text><path d="M508 201L508 307" class="line" marker-end="url(#open)"/><text x="529" y="263" class="label" text-anchor="start">assign / 记录班组</text><rect x="421" y="307" width="175" height="60" rx="12" class="green"/><text x="508.5" y="344.0" class="" text-anchor="middle">已派工</text><path d="M508 367L508 473" class="line" marker-end="url(#open)"/><text x="529" y="429" class="label" text-anchor="start">complete</text><rect x="421" y="473" width="175" height="60" rx="12" class="green"/><text x="508.5" y="510.0" class="" text-anchor="middle">已关闭</text><path d="M450 201V239H118V307" class="line" marker-end="url(#open)"/><text x="238" y="225" class="label" text-anchor="start">cancel</text><rect x="33" y="307" width="170" height="60" rx="12" class="box"/><text x="118.0" y="344.0" class="" text-anchor="middle">已取消</text><path d="M118 367V594H338" class="line" marker-end="url(#open)"/><path d="M508 533V594H370" class="line" marker-end="url(#open)"/><circle cx="354" cy="594" r="16" class="line"/><circle cx="354" cy="594" r="10" fill="#245a47"/><text x="28" y="657" class="label" text-anchor="start">箭头标注：事件 [守卫条件] / 动作。没有画出的迁移，不能自行补出。</text></svg>
