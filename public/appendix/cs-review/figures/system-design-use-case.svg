<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">报修系统用例图</title><desc id="desc">参与者在系统边界之外。提交报修单 include 校验表单；附加现场照片 extend 提交报修单。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:21px;fill:#20271f}.label{font-size:18px;fill:#62695f}.title{font-size:23px;font-weight:600}.box{fill:#fffcf6;stroke:#62695f;stroke-width:1.7}.green{fill:#e9eee4;stroke:#245a47;stroke-width:1.7}.line{fill:none;stroke:#245a47;stroke-width:1.8}.dash{stroke-dasharray:8 6}.small{font-size:17px}</style><defs><marker id="open" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#245a47" stroke-width="1.4"/></marker><marker id="filled" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#245a47"/></marker><marker id="triangle" markerWidth="15" markerHeight="15" refX="14" refY="7.5" orient="auto"><path d="M1 1L14 7.5L1 14Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.1"/></marker><marker id="diamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#fffcf6" stroke="#245a47" stroke-width="1.2"/></marker><marker id="solidDiamond" markerWidth="19" markerHeight="13" refX="1" refY="6.5" orient="auto"><path d="M1 6.5L9 1L17 6.5L9 12Z" fill="#245a47" stroke="#245a47" stroke-width="1.2"/></marker></defs><rect width="760" height="610" fill="#fffcf6"/><text x="28" y="38" class="title" text-anchor="start">用例图：角色、目标与系统边界</text><rect x="238" y="74" width="490" height="457" rx="0" class="box"/><text x="256" y="106" class="label" text-anchor="start">设备报修系统</text><circle cx="93" cy="264" r="17" class="line"/><path d="M93 281V332M62 303H124M93 332L66 371M93 332L120 371" class="line"/><text x="93" y="409" class="" text-anchor="middle">报修人</text><ellipse cx="445" cy="172" rx="155" ry="39" class="green"/><ellipse cx="445" cy="323" rx="155" ry="39" class="green"/><ellipse cx="445" cy="474" rx="155" ry="39" class="green"/><text x="445" y="179" class="" text-anchor="middle">校验表单</text><text x="445" y="330" class="" text-anchor="middle">提交报修单</text><text x="445" y="481" class="" text-anchor="middle">附加现场照片</text><path d="M124 303L290 323" class="line"/><path d="M445 284L445 211" class="line dash" marker-end="url(#open)"/><text x="466" y="256" class="label" text-anchor="start">«include»</text><path d="M445 435L445 362" class="line dash" marker-end="url(#open)"/><text x="466" y="406" class="label" text-anchor="start">«extend»</text><text x="28" y="577" class="label" text-anchor="start">include：提交用例指向被包含的校验；extend：附图用例指向基础提交。</text></svg>
